# .github/workflows/build.yml
# Не проверено: workflow не запускался.
name: build-crez

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone deps
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/ocornut/imgui third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby third_party/dobby

      - name: Patch Dobby RuntimeModule
        run: |
          # Добавляем поле load_address в struct RuntimeModule, если его нет.
          # Ищем определение структуры в любом заголовке Dobby.
          FILES=$(grep -rl "struct RuntimeModule" third_party/dobby --include=*.h --include=*.hpp || true)
          if [ -z "$FILES" ]; then
            echo "struct RuntimeModule не найден"; exit 1
          fi
          for f in $FILES; do
            if ! grep -q "load_address" "$f"; then
              perl -0pi -e 's/(struct\s+RuntimeModule\s*\{)/$1\n    void *load_address;/' "$f"
              echo "patched $f"
            fi
          done
          grep -rn "load_address" third_party/dobby --include=*.h --include=*.hpp | head -5

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          local-cache: true

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libcrez
          path: build/libcrez.so
